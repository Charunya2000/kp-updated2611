replicaCount: 1
name: aiplatform
labels:
  app.kubernetes.io/managed-by-NUID: A257371
image:
  repository: aiplatform
  tag: 0.1.21
  pullPolicy: Always
  labels:
    app: frontend-or-api
  containerPort: 8080
env:
  - name: LOG_LEVEL
    value: DEBUG
  - name: EDI_WORKBENCH_WORKER_MAX_OLD_GENERATION_SIZE_MB
    value: "1200"
  - name: KPCONFIG_ACCESSTOKEN
    valueFrom:
      secretKeyRef:
        name: aiplatform
        key: KPCONFIG_ACCESSTOKEN
  - name: KPCONFIG_USER
    valueFrom:
      secretKeyRef:
        name: aiplatform
        key: KPCONFIG_USER
  - name: KPCONFIG_PASSWORD
    valueFrom:
      secretKeyRef:
        name: aiplatform
        key: KPCONFIG_PASSWORD
  - name: KPCONFIG_URI
    valueFrom:
      secretKeyRef:
        name: aiplatform
        key: KPCONFIG_URI
  - name: KPCONFIG_LABEL
    value: master
  - name: KPCONFIG_NAME
    value: hpts-aisvc
  - name: KPCONFIG_PROFILE
    value: genai-port-client-dev

livenessProbe:
  enabled: true
  httpGet:
    path: /livenessprobe
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 5
readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 5

configmap:
  enabled: false

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: "1"
    memory: 2Gi

service:
  port: 80
  targetPort: 8080

virtualServer:
  enabled: true
  vss:
    - host: dev-aiportal-web-2.aisvc.aksnp.azure.kp.org
      type: live
      clientMaxBodySize: 200m
      upstream:
        readTimeout: 180s
        sendTimeout: 180s
        connectTimeout: 60s
      # Add SSE-specific settings
      proxyBuffering: "off"
      proxyRequestBuffering: "off"
      proxyReadTimeout: 3600s
      proxyConnectTimeout: 60s
      annotations:
        nginx.org/proxy-buffering: "off"
        nginx.org/proxy-request-buffering: "off"

nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: {}
